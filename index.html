
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>学校行事 時程計算ツール</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f1f5f9;
      padding: 20px;
      color: #1e293b;
    }
    main {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    label {
      display: block;
      margin-top: 20px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 18px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 24px;
    }
    #result {
      font-size: 24px;
      font-weight: bold;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <main>
    <h1>学校行事 時程計算</h1>
    <label for="start">開始時刻</label>
    <input type="time" id="start" value="09:00">

    <label for="minutes">活動時間（分）</label>
    <input type="number" id="minutes"
           value="45" min="1" max="1440">

    <button onclick="calculate()">計算する</button>
    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    function calculate() {
      const start =
        document.getElementById("start").value;
      const minutes = Number(
        document.getElementById("minutes").value
      );
      const result =
        document.getElementById("result");

      if (!/^\d{2}:\d{2}$/.test(start) ||
          !Number.isInteger(minutes) ||
          minutes < 1 || minutes > 1440) {
        result.textContent =
          "時刻と活動時間を確認してください。";
        return;
      }

      const [h, m] = start.split(":").map(Number);
      const total = h * 60 + m + minutes;
      const endH = Math.floor(total / 60) % 24;
      const endM = total % 60;
      const nextDay = total >= 1440 ? "翌日 " : "";

      result.textContent =
        "終了時刻：" + nextDay +
        String(endH).padStart(2, "0") + ":" +
        String(endM).padStart(2, "0");
    }
  </script>
</body>
</html>
